<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=], initial-scale=1.0">
    <title>Get and Post Request</title>
</head>
<body>
    <h3>GET request form</h3>
    <form method="get" action="http://localhost:8080/register">
        <input placeholder="user name"  name="user" type="text">
        <input placeholder="password"  name="password" type="text">
        <button>Submint</button>
    </form>
    <h3>POST request form</h3>
    <form method="post" action="http://localhost:8080/register">
        <input placeholder="user name"  name="user" type="text">
        <input placeholder="password"  name="password" type="text">
        <button>Submint</button>
    </form>
</body>
</html>
